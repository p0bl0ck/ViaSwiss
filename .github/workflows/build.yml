name: Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'both'
        type: choice
        options:
          - android
          - ios
          - both
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'android' ||
      github.event.inputs.platforms == 'both'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java-version: '17'

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == ''
        run: flutter build apk --debug

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event_name == 'push'
        run: flutter build apk --release

      - name: Build Release App Bundle
        if: github.event.inputs.build_type == 'release' || github.event_name == 'push'
        run: flutter build appbundle --release

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == ''
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Release App Bundle
        if: github.event.inputs.build_type == 'release' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'ios' ||
      github.event.inputs.platforms == 'both'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Build iOS (no codesign)
        run: |
          if [[ "${{ github.event.inputs.build_type }}" == "release" ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            flutter build ios --release --no-codesign
          else
            flutter build ios --debug --no-codesign
          fi

      - name: Build iOS Archive
        run: |
          cd ios
          if [[ "${{ github.event.inputs.build_type }}" == "release" ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            CONFIG="Release"
          else
            CONFIG="Debug"
          fi
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration $CONFIG \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.event.inputs.build_type || 'release' }}-build
          path: build/ios/iphonesimulator/Runner.app
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
