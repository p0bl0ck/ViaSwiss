name: 'Setup Flutter'
description: 'Checkout code, setup Flutter, install dependencies, and optionally run code generation'

inputs:
  flutter-version:
    description: 'Flutter version to use'
    required: false
    default: '3.38.6'
  java-version:
    description: 'Java version for Android builds'
    required: false
    default: ''
  run-codegen:
    description: 'Run build_runner code generation'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Java
      if: inputs.java-version != ''
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: 'stable'
        cache: true

    - name: Get dependencies
      shell: bash
      run: flutter pub get

    - name: Run code generation
      if: inputs.run-codegen == 'true'
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs
