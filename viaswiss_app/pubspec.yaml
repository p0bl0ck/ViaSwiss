name: viaswiss_app
description: Swiss train journey planner with weather integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.5

  # GraphQL
  graphql_flutter: ^5.1.2
  gql: ^1.0.0

  # Navigation
  go_router: ^13.0.1

  # Maps
  maplibre_gl: ^0.18.0

  # UI
  flutter_svg: ^2.0.9
  intl: ^0.19.0

  # Storage
  shared_preferences: ^2.2.2

  # Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.11
  freezed: ^2.4.6
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.4.4
  fake_async: ^1.3.1
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
