name: viaswiss_app
description: Swiss train journey planner with weather integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # GraphQL
  graphql_flutter: ^5.1.2
  gql: ^1.0.0

  # Navigation
  go_router: ^17.0.1

  # Maps
  maplibre_gl: ^0.25.0

  # UI
  flutter_svg: ^2.0.9
  intl: ^0.20.2

  # Storage
  shared_preferences: ^2.2.2

  # Utils
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.4.4
  fake_async: ^1.3.1
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

